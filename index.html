<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة الملاعب والأكاديميات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
:root{
  --turf:#0d8f6a; --turf-dark:#062b21; --chalk:#f1f6f3; --paper:#ffffff;
  --ink:#10231b; --muted:#66796f; --line:#e1e9e4; --gold:#f0a21c;
  --red:#e0483e; --amber:#f08c1a; --ok:#15a36b; --blue:#2f7fd1;
  --soft:#f5f9f7; --soft2:#e8f2ed; --r:18px;
  --shadow:0 1px 2px rgba(10,40,28,.05),0 10px 28px rgba(10,40,28,.07);
  --grad:linear-gradient(135deg,#12b58a,#0b7d9a);
  color-scheme:light;
}
[data-theme=dark]{
  --turf:#1ac79a; --turf-dark:#04110d; --chalk:#0a1411; --paper:#11201a;
  --ink:#e6f2ec; --muted:#8aa699; --line:#21352d; --soft:#16271f; --soft2:#1b3329;
  --red:#ff6f65; --ok:#2bd08e; --blue:#5aa5ee;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Cairo',Tahoma,sans-serif;background:var(--chalk);color:var(--ink);line-height:1.6;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(900px 420px at 80% -8%,rgba(18,181,138,.13),transparent 60%),radial-gradient(700px 420px at 0% 100%,rgba(47,127,209,.09),transparent 60%)}

/* ===== القائمة الجانبية ===== */
header{position:fixed;top:0;bottom:0;right:0;width:264px;z-index:30;display:flex;flex-direction:column;padding:18px 14px;
  background:linear-gradient(185deg,#08382a 0%,#062b21 50%,#041d16 100%);color:#fff;overflow-y:auto}
.bar{display:contents}
.brand{order:0;display:flex;align-items:center;gap:12px;font-weight:900;font-size:17px;line-height:1.3;padding:6px 8px 20px}
.brand .logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#19c597,#f0a21c);display:grid;place-items:center;font-size:23px;box-shadow:0 8px 20px rgba(25,197,151,.35);flex:none}
.brand small{display:block;font-size:12px;font-weight:600;color:#8fb8a8}
nav{order:1;flex:1;display:flex;flex-direction:column;gap:4px;padding:6px 0}
nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:none;border:0;color:#a8c8ba;font:inherit;font-weight:600;font-size:15px;padding:11px 14px;border-radius:13px;cursor:pointer;transition:.18s;white-space:nowrap}
nav button svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(-2px)}
nav button.on{background:linear-gradient(135deg,#14c093,#0d8f6a);color:#fff;box-shadow:0 8px 20px rgba(13,143,106,.45)}
nav button[hidden]{display:none}
.side{order:2;display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
.side .btn{color:#cfe6dc;border:1px solid rgba(255,255,255,.18);background:transparent;box-shadow:none}
.side .btn:hover{background:rgba(255,255,255,.1);filter:none}
.mode{font-size:12px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.12);text-align:center;color:#d6efe4;word-break:break-all}
.mode.warn{background:var(--amber);color:#fff}

main{margin:0 264px 0 0;padding:28px 34px 70px;max-width:none}
h2{margin:0 0 14px;font-size:24px;font-weight:900;letter-spacing:-.2px}
h3{margin:0 0 12px;font-size:16.5px;font-weight:800}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .grow{flex:1}

/* ===== أزرار وحقول ===== */
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:9px 18px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#12b58a,#0d8f6a);box-shadow:0 5px 14px rgba(13,143,106,.28);transition:.16s;display:inline-block;text-decoration:none}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.ghost{background:transparent;color:var(--turf);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--soft2);border-color:var(--turf);filter:none}
.btn.gold{background:linear-gradient(135deg,#f7b83e,#ee8f1d);box-shadow:0 5px 14px rgba(240,162,28,.32)}
.btn.danger{background:transparent;color:var(--red);border:1px solid rgba(224,72,62,.35);box-shadow:none}
.btn.danger:hover{background:rgba(224,72,62,.09);filter:none}
.btn.sm{padding:4px 12px;font-size:13px;border-radius:10px}
nav button:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select{font:inherit;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);width:100%;transition:.16s}
input:focus,select:focus{outline:none;border-color:var(--turf);box-shadow:0 0 0 4px rgba(13,143,106,.16)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:700}
.field{margin-bottom:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.muted{color:var(--muted)}

/* ===== البطاقات والجداول ===== */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
th{text-align:right;color:var(--muted);font-weight:700;font-size:12.5px;padding:10px 12px;background:var(--soft);white-space:nowrap}
th:first-child{border-radius:0 10px 10px 0}th:last-child{border-radius:10px 0 0 10px}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr:hover td{background:var(--soft)}
td.act>*{margin-inline-end:6px;vertical-align:middle}
.num{font-variant-numeric:tabular-nums;font-weight:800}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.tag{display:inline-block;padding:2px 12px;border-radius:99px;font-size:12px;font-weight:800}
.tag.ok{background:rgba(21,163,107,.14);color:var(--ok)}
.tag.soon{background:rgba(240,140,26,.16);color:#c86f00}
.tag.exp{background:rgba(224,72,62,.13);color:var(--red)}
[data-theme=dark] .tag.soon{color:#ffb257}

.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:20px}
.tot{position:relative;overflow:hidden;background:var(--grad);color:#fff;border-radius:var(--r);padding:16px 20px;box-shadow:0 12px 26px rgba(13,143,106,.25)}
.tot::after{content:"";position:absolute;left:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.13)}
.tot.gold{background:linear-gradient(135deg,#f7b83e,#ee8f1d);box-shadow:0 12px 26px rgba(238,143,29,.32)}
.tot small{opacity:.9;display:block;font-weight:600}
.tot b{font-size:27px;font-weight:900}
.pitch{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);margin-bottom:20px;overflow:hidden;box-shadow:var(--shadow)}
.pitch-head{background:linear-gradient(120deg,#08382a,#0d8f6a);color:#fff;padding:13px 20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-weight:800}
.pitch-body{padding:8px 18px 14px}
.pitch-foot{background:var(--soft);padding:12px 20px;display:flex;gap:24px;flex-wrap:wrap;font-weight:700;border-top:1px dashed var(--line)}

/* ===== لوحة التحكم ===== */
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#08382a 0%,#0d8f6a 62%,#0b7d9a 100%);color:#fff;border-radius:24px;padding:26px 30px;margin-bottom:20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;box-shadow:0 16px 38px rgba(7,51,38,.3)}
.hero::before{content:"";position:absolute;left:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero::after{content:"";position:absolute;left:140px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:rgba(240,162,28,.22)}
.hero h2{color:#fff;margin:0;font-size:28px}
.hero p{margin:4px 0 0;opacity:.88}
.hero .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:relative;z-index:1}
.hero .ctl input{width:auto;background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.3);color-scheme:dark}
.hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4)}
.hero>div{position:relative;z-index:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:14px;margin-bottom:18px}
.kpi{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow);transition:.18s}
.kpi:hover{transform:translateY(-3px)}
.kpi::before{content:"";position:absolute;right:0;top:0;bottom:0;width:5px;background:var(--turf)}
.kpi::after{content:"";position:absolute;left:-28px;bottom:-30px;width:100px;height:100px;border-radius:50%;background:var(--turf);opacity:.08}
.kpi.red::before,.kpi.red::after{background:var(--red)}
.kpi.blue::before,.kpi.blue::after{background:var(--blue)}
.kpi.gold{background:linear-gradient(135deg,#f7b83e,#ee8f1d);border:0;color:#fff;box-shadow:0 14px 30px rgba(238,143,29,.36)}
.kpi.gold::before{display:none}.kpi.gold::after{background:#fff;opacity:.2}
.kpi small{color:var(--muted);font-weight:700;display:block}
.kpi.gold small,.kpi.gold em,.kpi.gold .muted{color:rgba(255,255,255,.92)}
.kpi b{font-size:26px;font-weight:900;display:block;line-height:1.4}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.dl{font-size:12px;font-weight:800;padding:0 8px;border-radius:7px}
.dl.up{color:#0b7a4b;background:#dff4e9}.dl.dn{color:#c2362d;background:#fbe3e0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:12px;align-items:center;margin:12px 0;font-size:14px}
.hb small{display:block;color:var(--muted);font-size:11px}
.hb .tr{background:var(--soft2);border-radius:99px;height:12px;overflow:hidden}
.hb .fl{height:100%;border-radius:99px;background:var(--grad)}
.stack{display:flex;height:18px;border-radius:99px;overflow:hidden;background:var(--soft2);margin:6px 0}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px}
.alert{background:rgba(240,162,28,.13);border:1px solid rgba(240,162,28,.45);border-radius:14px;padding:11px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#08382a;color:#fff;padding:11px 24px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:99;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.on{opacity:1;transform:translateX(-50%)}

/* ===== نوافذ + دخول ===== */
dialog{border:0;border-radius:22px;padding:0;width:min(600px,94vw);box-shadow:0 30px 80px rgba(0,0,0,.4);background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(4,20,14,.62);backdrop-filter:blur(5px)}
.dlg{padding:24px}
.dlg-act{display:flex;gap:8px;justify-content:flex-start;margin-top:10px}
#login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(600px 400px at 85% 10%,rgba(240,162,28,.35),transparent 60%),linear-gradient(135deg,#062b21,#0d8f6a 70%,#0b7d9a)}
#login[hidden]{display:none}
#login .box{background:var(--paper);border-radius:26px;padding:32px;width:min(410px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.lg-logo{width:62px;height:62px;border-radius:19px;margin:0 auto 12px;display:grid;place-items:center;font-size:31px;background:linear-gradient(135deg,#19c597,#f0a21c);box-shadow:0 10px 24px rgba(25,197,151,.4)}
#lErr{color:var(--red);font-size:13px;min-height:20px}

/* ===== كشوف وإيصالات ===== */
.st-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px double var(--turf);padding-bottom:12px;margin-bottom:14px}
.st-org{color:var(--turf);font-weight:900;font-size:15px}.st-meta{font-size:13px;line-height:1.8}
.st-sum{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.st-sum div{flex:1;min-width:150px;border:1px solid var(--line);border-radius:12px;padding:9px 14px;background:var(--soft)}
.st-sum b{display:block;font-size:18px}
.tot-row td{background:var(--soft2)!important;font-weight:900}
.sign{display:flex;justify-content:space-around;gap:20px;margin-top:42px;font-weight:700}
.sign span{border-top:1px solid currentColor;padding:6px 30px;min-width:170px;text-align:center}
#rcpt{display:none}
.rc{border:2px solid #08382a;border-radius:12px;padding:16px 20px;margin:0 auto 14mm;max-width:178mm;break-inside:avoid;background:#fff;color:#10231b}
.rc-h{display:flex;justify-content:space-between;color:#08382a;border-bottom:2px solid #0d8f6a;padding-bottom:6px}
.rc h2{text-align:center;margin:10px 0}
.rc-meta{display:flex;justify-content:space-between;margin-bottom:10px}
.rc-t{width:100%;border:1px solid #d7e2dc}
.rc-t th{width:30%;background:#f1f6f3;border:1px solid #d7e2dc;color:#10231b}
.rc-t td{border:1px solid #d7e2dc;white-space:normal;background:#fff!important}
.rc-sign{display:flex;justify-content:space-between;margin-top:30px;font-weight:700}

@media(max-width:900px){
  header{position:sticky;bottom:auto;width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;gap:6px;overflow:visible}
  .brand{padding:0;flex:1}.brand small{display:none}.brand .logo{width:36px;height:36px;font-size:19px}
  .side{order:1;flex-direction:row;border:0;padding:0;gap:6px;flex-wrap:wrap}
  .side .mode{display:none}
  nav{order:3;flex:none;width:100%;flex-direction:row;overflow-x:auto;padding:4px 0 2px}
  nav button{width:auto;padding:8px 13px;font-size:14px}
  nav button:hover{transform:none}
  main{margin:0;padding:16px 14px 60px}
  .grid2{grid-template-columns:1fr}
  .hero{padding:20px}.hero h2{font-size:23px}
}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  @page{size:A4;margin:12mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  [data-theme=dark]{--chalk:#fff;--paper:#fff;--ink:#10231b;--muted:#66796f;--line:#e1e9e4;--soft:#f5f9f7;--soft2:#e8f2ed;--turf:#0d8f6a;--red:#e0483e;--ok:#15a36b;--blue:#2f7fd1}
  header,.noprint,#login,dialog,#toast{display:none!important}
  body{background:#fff}body::before{display:none}
  main{margin:0;max-width:none;padding:0}
  body.pr main{display:none!important}
  body.pr #rcpt{display:block}
  tr{break-inside:avoid}h3{break-after:avoid}
  td,th{white-space:normal}
  tr:hover td{background:transparent}
  .acad-block+.acad-block{break-before:page}
  .panel,.kpi,.pitch{box-shadow:none}
  .kpi:hover{transform:none}
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand"><span class="logo">⚽</span><span>إدارة الملاعب<small>والأكاديميات</small></span></div>
    <div class="side">
      <span class="mode" id="modeTag"></span>
      <button class="btn sm ghost" id="themeBtn" onclick="toggleTheme()">🌙 الوضع الداكن</button>
      <button class="btn sm ghost" onclick="exportBackup()">نسخة احتياطية</button>
      <button class="btn sm ghost" id="logoutBtn" hidden
        onclick="firebase.auth().signOut().then(()=>location.reload())">خروج</button>
    </div>
  </div>
  <nav id="nav">
    <button data-t="dashboard" id="dashTab" class="on" hidden><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>لوحة التحكم</button>
    <button data-t="accounts"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h12v4"/><path d="M3 7v10a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="13.5" r="1"/></svg>الحسابات</button>
    <button data-t="members"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3a6.5 6.5 0 0 1 3.5 5.7"/></svg>المشتركين</button>
    <button data-t="receipts"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>الإيصالات</button>
    <button data-t="rentals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>إيجار الساعات</button>
    <button data-t="expenses"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>المصروفات</button>
    <button data-t="academies"><svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11.5V16c0 1.5 2.2 3 5 3s5-1.5 5-3v-4.5"/></svg>الأكاديميات</button>
    <button data-t="fields"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.5"/></svg>الملاعب</button>
    <button data-t="report" id="reportTab" hidden><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 17v-3M12 17v-6M15 17v-4"/></svg>تقرير الأكاديميات</button>
    <button data-t="logs" id="logsTab" hidden><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 8v4l3 2"/></svg>سجل التحديثات</button>
  </nav>
</header>

<main id="view"></main>

<div id="login" hidden>
  <div class="box">
    <div class="lg-logo">⚽</div><h3 style="text-align:center;font-size:22px;margin-bottom:2px">إدارة الملاعب والأكاديميات</h3><p class="muted" style="text-align:center;margin:0 0 18px">سجّل دخولك للمتابعة</p>
    <div class="field"><label>الإيميل</label><input id="lEmail" type="email" autocomplete="username"></div>
    <div class="field"><label>الباسورد</label><input id="lPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div id="lErr"></div>
    <button class="btn" style="width:100%" onclick="doLogin()">دخول</button>
  </div>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="rcpt"></div><div id="toast"></div>

<script>
/* ============ إعدادات Firebase ============ */
const firebaseConfig = {
  apiKey: "AIzaSyCT0yFcNQnHRsS8CfV9osTqin0-p_mSKmQ",
  authDomain: "academ-b575d.firebaseapp.com",
  projectId: "academ-b575d",
  storageBucket: "academ-b575d.firebasestorage.app",
  messagingSenderId: "35945920566",
  appId: "1:35945920566:web:b8c0dd2e58295ab9e58097"
};
const ORG_NAME = "إدارة الملاعب والأكاديميات";   // الاسم اللي بيظهر في الإيصالات وكشوف الحساب
const ADMIN_EMAIL = "admin@academy.com";   // نفس الإيميل اللي في الـ Rules

/* ============ طبقة البيانات ============ */
const COLS = ['fields','academies','members','payments','rentals','expenses'];
const store = {fields:[],academies:[],members:[],payments:[],rentals:[],expenses:[],logs:[]};
const useFirebase = !firebaseConfig.apiKey.startsWith('YOUR');
let fdb = null;
let USER = {email:'محلي',uid:'local'};
let isAdmin = !useFirebase;

if(useFirebase){ firebase.initializeApp(firebaseConfig); fdb = firebase.firestore(); }

const SEC = {fields:'الملاعب',academies:'الأكاديميات',members:'المشتركين',payments:'المدفوعات',rentals:'الإيجار',expenses:'المصروفات'};
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function labelOf(c,o){
  switch(c){
    case 'fields': return 'ملعب: '+o.name;
    case 'academies': return `أكاديمية: ${o.name} (نسبتي ${o.myPct}%)`;
    case 'members': return `مشترك: ${o.name} — ${nameOf('academies',o.academyId)}`;
    case 'payments': return `${o.type==='new'?'اشتراك جديد':'تجديد'}: ${o.memberName||''} — ${money(o.amount)}${o.receiptNo?' — إيصال '+o.receiptNo:''}`;
    case 'rentals': return `إيجار ${nameOf('fields',o.fieldId)} — ${o.hours} ساعة — ${money(o.total)}${o.receiptNo?' — إيصال '+o.receiptNo:''}`;
    case 'expenses': return `مصروف: ${o.title} — ${money(o.amount)}${o.receiptNo?' — فاتورة '+o.receiptNo:''}`;
  }
  return c;
}
async function writeLog(action,c,label){
  const entry={action,section:c,label,user:USER.email,uid:USER.uid};
  try{
    if(useFirebase) await fdb.collection('logs').add({...entry,time:firebase.firestore.FieldValue.serverTimestamp()});
    else{ store.logs.unshift({id:uid(),...entry,time:Date.now()}); localStorage.setItem('sm_logs',JSON.stringify(store.logs)); }
  }catch(e){ console.warn('تعذر تسجيل العملية',e); }
}

const Data = {
  start(){
    if(useFirebase){
      COLS.forEach(c=>{
        fdb.collection(c).onSnapshot(snap=>{
          store[c]=snap.docs.map(d=>({id:d.id,...d.data()})); render();
        }, toastErr);
      });
      if(isAdmin){
        fdb.collection('logs').orderBy('time','desc').limit(500).onSnapshot(snap=>{
          store.logs=snap.docs.map(d=>{const x=d.data();return {id:d.id,...x,time:x.time?.toMillis?.()??Date.now()};}); render();
        }, e=>console.warn(e));
      }
    }else{
      [...COLS,'logs'].forEach(c=>{ store[c]=JSON.parse(localStorage.getItem('sm_'+c)||'[]'); });
      render();
    }
  },
  _save(c){ if(!useFirebase) localStorage.setItem('sm_'+c,JSON.stringify(store[c])); },
  async add(c,obj,o={}){
    let id;
    if(useFirebase){ id=(await fdb.collection(c).add({...obj,createdAt:firebase.firestore.FieldValue.serverTimestamp()})).id; }
    else{ id=uid(); store[c].push({id,...obj}); this._save(c); render(); }
    if(!o.silent) await writeLog('add',c,labelOf(c,obj));
    return id;
  },
  async set(c,id,obj,o={}){
    const merged={...byId(c,id),...obj};
    if(useFirebase) await fdb.collection(c).doc(id).update(obj);
    else{ const i=store[c].findIndex(x=>x.id===id); store[c][i]=merged; this._save(c); render(); }
    if(!o.silent) await writeLog('edit',c,labelOf(c,merged));
  },
  async del(c,id,o={}){
    const old=byId(c,id);
    if(useFirebase) await fdb.collection(c).doc(id).delete();
    else{ store[c]=store[c].filter(x=>x.id!==id); this._save(c); render(); }
    if(!o.silent && old) await writeLog('delete',c,labelOf(c,old));
  }
};
function toastErr(e){ console.error(e); alert('حصل خطأ في Firebase: '+(e.message||e)); }

/* ============ أدوات ============ */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money = n=>(Math.round((+n||0)*100)/100).toLocaleString('ar-EG')+' ج';
const todayStr = ()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function addMonth(s){
  const [y,m,d]=s.split('-').map(Number);
  const t=new Date(y,m,1);
  const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  t.setDate(Math.min(d,last));
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
}
function daysLeft(end){ return Math.round((new Date(end+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000); }
function statusOf(end){
  const d=daysLeft(end);
  if(d<0) return ['exp','منتهي'];
  if(d<=3) return ['soon','قرب يخلص ('+d+' يوم)'];
  return ['ok','ساري ('+d+' يوم)'];
}
const byId=(c,id)=>store[c].find(x=>x.id===id);
const nameOf=(c,id)=>byId(c,id)?.name ?? '— محذوف —';
const val=id=>$('#'+id).value.trim();
const options=(c,sel,filter)=>store[c].filter(filter||(()=>true)).map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name)}</option>`).join('');

function openDlg(html,onSave,saveLabel='حفظ'){
  $('#dlgBody').innerHTML = html+`<div class="dlg-act"><button class="btn" id="dSave">${saveLabel}</button><button class="btn ghost" id="dCancel">إلغاء</button></div>`;
  $('#dCancel').onclick=()=>$('#dlg').close();
  $('#dSave').onclick=async()=>{
    try{ const ok=await onSave(); if(ok!==false){ $('#dlg').close(); if(saveLabel!=='تمام') toast('تم الحفظ ✓'); } }catch(e){toastErr(e);}
  };
  if(!$('#dlg').open) $('#dlg').showModal();
}

/* ============ المشتركين + التجديد ============ */
let memberFilter={q:'',academy:'',status:''};
function calcSplit(academy,amount){
  const mine=Math.round(amount*academy.myPct)/100;
  return {myShare:mine,academyShare:Math.round((amount-mine)*100)/100,pct:academy.myPct};
}
function memberForm(){
  const fieldsWithAcad=store.fields.filter(f=>store.academies.some(a=>a.fieldId===f.id));
  if(!fieldsWithAcad.length) return alert('ضيف ملعب وأكاديمية عليه الأول');
  const f0=fieldsWithAcad[0], a0=store.academies.find(a=>a.fieldId===f0.id);
  openDlg(`<h3>مشترك جديد</h3>
    <div class="field"><label>اسم المشترك</label><input id="mName"></div>
    <div class="field"><label>رقم التليفون</label><input id="mPhone" inputmode="tel"></div>
    <div class="field"><label>الملعب</label>
      <select id="mField" onchange="pickAcademies()">${fieldsWithAcad.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></div>
    <div class="field"><label>الأكاديمية</label>
      <select id="mAcad" onchange="$('#mAmount').value=byId('academies',this.value).price||''">
      ${store.academies.filter(a=>a.fieldId===f0.id).map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div>
    <div class="row2">
      <div class="field"><label>المبلغ المدفوع</label><input id="mAmount" type="number" min="0" value="${a0.price||''}"></div>
      <div class="field"><label>أول يوم اشتراك</label><input id="mStart" type="date" value="${todayStr()}" onchange="$('#mEnd').value=addMonth(this.value)"></div>
    </div>
    <div class="field"><label>تاريخ الانتهاء (شهر)</label><input id="mEnd" type="date" value="${addMonth(todayStr())}"></div>
    ${rcptFields('m')}${printChk('m')}`,
  async()=>{
    if(!val('mName')) return alert('اكتب اسم المشترك'), false;
    const amount=+val('mAmount'); if(!(amount>0)) return alert('اكتب المبلغ'), false;
    const a=byId('academies',val('mAcad')); const s=calcSplit(a,amount);
    const rc=readRcpt('m','in'); if(!rc) return false;
    const mid=await Data.add('members',{name:val('mName'),phone:val('mPhone'),academyId:a.id,fieldId:a.fieldId,start:val('mStart'),end:val('mEnd')});
    const pay={memberId:mid,memberName:val('mName'),academyId:a.id,fieldId:a.fieldId,type:'new',amount,...s,date:val('mStart'),start:val('mStart'),end:val('mEnd'),...rc};
    const pid=await Data.add('payments',pay,{silent:true});
    if($('#mPrint').checked) setTimeout(()=>printReceiptData('payments',{id:pid,...pay}),300);
  });
}
function pickAcademies(){
  const list=store.academies.filter(a=>a.fieldId===val('mField'));
  $('#mAcad').innerHTML=list.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');
  $('#mAmount').value=list[0]?.price||'';
}
function renewForm(id){
  const m=byId('members',id), a=byId('academies',m.academyId);
  if(!a) return alert('الأكاديمية دي اتحذفت');
  const startDefault=daysLeft(m.end)>=0?m.end:todayStr();
  openDlg(`<h3>تجديد: ${esc(m.name)}</h3>
    <div class="hint" style="margin-bottom:10px">${esc(a.name)} — الاشتراك الحالي ينتهي ${m.end}</div>
    <div class="row2">
      <div class="field"><label>المبلغ</label><input id="rAmount" type="number" min="0" value="${a.price||''}"></div>
      <div class="field"><label>بداية التجديد</label><input id="rStart" type="date" value="${startDefault}" onchange="$('#rEnd').value=addMonth(this.value)"></div>
    </div>
    <div class="field"><label>الانتهاء الجديد</label><input id="rEnd" type="date" value="${addMonth(startDefault)}"></div>
    ${rcptFields('rn')}${printChk('rn')}`,
  async()=>{
    const amount=+val('rAmount'); if(!(amount>0)) return alert('اكتب المبلغ'), false;
    const s=calcSplit(a,amount);
    const rc=readRcpt('rn','in'); if(!rc) return false;
    const pay={memberId:m.id,memberName:m.name,academyId:a.id,fieldId:a.fieldId,type:'renew',amount,...s,date:val('rStart'),start:val('rStart'),end:val('rEnd'),...rc};
    const pid=await Data.add('payments',pay);
    if($('#rnPrint').checked) setTimeout(()=>printReceiptData('payments',{id:pid,...pay}),300);
    await Data.set('members',m.id,{start:val('rStart'),end:val('rEnd')},{silent:true});
  },'تأكيد التجديد');
}

  const m=byId('members',id);
  const rows=store.payments.filter(p=>p.memberId===id).sort((a,b)=>b.date.localeCompare(a.date));
  openDlg(`<h3>سجل مدفوعات: ${esc(m.name)}</h3><div class="tablewrap"><table><tr><th>إيصال</th><th>تاريخ الإيصال</th><th>النوع</th><th>المبلغ</th><th>نصيبي</th><th>الفترة</th><th></th></tr>
   ${rows.map(p=>`<tr><td>${p.receiptNo?`<b>${esc(p.receiptNo)}</b>`:'<span class="tag exp">بدون</span>'}</td><td>${p.receiptDate||'—'}</td><td>${p.type==='new'?'جديد':'تجديد'}</td><td class="num">${money(p.amount)}</td><td class="num">${money(p.myShare)}</td><td>${p.start} → ${p.end}</td>
   <td class="act"><button class="btn sm ghost" onclick="printReceipt('payments','${p.id}')">طباعة</button><button class="btn sm ghost" onclick="editReceipt('payments','${p.id}')">تعديل</button></td></tr>`).join('')}</table></div>`,()=>true,'تمام');
}
function viewMembers(){
  const q=memberFilter.q.toLowerCase();
  const list=store.members.filter(m=>
    (!q||m.name.toLowerCase().includes(q)||(m.phone||'').includes(q)) &&
    (!memberFilter.academy||m.academyId===memberFilter.academy) &&

  return `<div class="toolbar"><h2 class="grow" style="margin:0">المشتركين</h2><button class="btn" onclick="memberForm()">+ مشترك جديد</button></div>
  <div class="toolbar">

    <select style="max-width:200px" onchange="memberFilter.academy=this.value;render()"><option value="">كل الأكاديميات</option>${options('academies',memberFilter.academy)}</select>
    <select style="max-width:160px" onchange="memberFilter.status=this.value;render()">
      <option value="">كل الحالات</option>
      <option value="ok" ${memberFilter.status==='ok'?'selected':''}>ساري</option>
      <option value="soon" ${memberFilter.status==='soon'?'selected':''}>قرب يخلص</option>
      <option value="exp" ${memberFilter.status==='exp'?'selected':''}>منتهي</option></select>
  </div>
  <div class="panel tablewrap">${list.length?`<table><tr><th>الاسم</th><th>التليفون</th><th>الملعب</th><th>الأكاديمية</th><th>البداية</th><th>الانتهاء</th><th>الحالة</th><th></th></tr>
  ${list.map(m=>{const [c,t]=statusOf(m.end);return `<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.phone||'—')}</td>
   <td>${esc(nameOf('fields',m.fieldId))}</td><td>${esc(nameOf('academies',m.academyId))}</td><td>${m.start}</td><td>${m.end}</td>
   <td><span class="tag ${c}">${t}</span></td>
   <td class="act"><button class="btn sm gold" onclick="renewForm('${m.id}')">تجديد</button>
   <button class="btn sm ghost" onclick="historyOf('${m.id}')">السجل</button>${waBtn(m)}
   <button class="btn sm danger" onclick="delMember('${m.id}')">حذف</button></td></tr>`}).join('')}</table>`
   :'<div class="empty">مفيش مشتركين مطابقين</div>'}</div>`;
}
function keepFocus(el){
  const pos=el.selectionStart; render(); const n=document.querySelector('input[placeholder^="بحث"]'); n.focus(); n.setSelectionRange(pos,pos);
}
async function delMember(id){
  if(!confirm('هتمسح المشترك وكل سجل مدفوعاته (وده هيتخصم من الحسابات). متأكد؟')) return;
  await Promise.all(store.payments.filter(p=>p.memberId===id).map(p=>Data.del('payments',p.id,{silent:true})));
  await Data.del('members',id);
}

/* ============ المصروفات ============ */
let expMonth=todayStr().slice(0,7);
function expenseForm(e={}){

function allReceipts(){
  const P=store.payments.map(p=>({id:p.id,col:'payments',kind:'in',no:p.receiptNo||'',date:p.receiptDate||p.date,type:p.type==='new'?'اشتراك جديد':'تجديد',who:p.memberName||nameOf('members',p.memberId),academyId:p.academyId,fieldId:p.fieldId,amount:p.amount}));
  const R=store.rentals.map(r=>({id:r.id,col:'rentals',kind:'in',no:r.receiptNo||'',date:r.receiptDate||r.date,type:'إيجار ساعات',who:r.renter||'—',fieldId:r.fieldId,amount:r.total}));
  const E=store.expenses.map(e=>({id:e.id,col:'expenses',kind:'out',no:e.receiptNo||'',date:e.receiptDate||e.date,type:'مصروف',who:e.title,amount:e.amount}));
  return [...P,...R,...E];
}
function nextNo(kind){
  let best=null;
  allReceipts().filter(r=>r.kind===kind).forEach(r=>{
    const m=String(r.no||'').match(/^(.*?)(\d+)$/);
    if(m&&(!best||+m[2]>best.n)) best={p:m[1],n:+m[2],w:m[2].length};
  });
  return best?best.p+String(best.n+1).padStart(best.w,'0'):'1';
}
function rcptFields(p,o={}){
  const kind=o.kind||'in', opt=kind==='out';
  const no=(o.receiptNo!==undefined&&o.receiptNo!=='')?o.receiptNo:(opt?'':nextNo(kind));
  return `<div class="row2"><div class="field"><label>${opt?'رقم الفاتورة / السند':'رقم الإيصال'}</label>
    <div style="display:flex;gap:6px"><input id="${p}No" value="${esc(no)}" ${opt?'placeholder="اختياري"':''}>
    <button type="button" class="btn sm ghost" onclick="$('#${p}No').value=nextNo('${kind}')">تلقائي</button></div></div>
    <div class="field"><label>تاريخ ${opt?'الفاتورة':'الإيصال'}</label><input id="${p}Dt" type="date" value="${o.receiptDate||todayStr()}"></div></div>`;
}
const printChk=p=>`<label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)"><input type="checkbox" id="${p}Print" style="width:auto"> طباعة الإيصال بعد الحفظ</label>`;
function readRcpt(p,kind,ignoreId){
  const no=val(p+'No'), dt=val(p+'Dt');
  if(!no&&kind==='in') return alert('اكتب رقم الإيصال'), false;
  if(!dt) return alert('اكتب تاريخ الإيصال'), false;
  const d=no&&allReceipts().find(r=>r.kind===kind&&r.no===no&&r.id!==ignoreId);

function downloadCSV(name,rows){

  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

/* ============ لوحة التحكم ============ */
let dashM=todayStr().slice(0,7);
function prevMonth(m){const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function monthsBack(n){const o=[],d=new Date();for(let i=n-1;i>=0;i--){const t=new Date(d.getFullYear(),d.getMonth()-i,1);o.push(t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0'));}return o;}
function periodStats(inR){
  const ps=store.payments.filter(p=>inR(p.date)), rs=store.rentals.filter(r=>inR(r.date)), es=store.expenses.filter(e=>inR(e.date));
  const subs=sum(ps,p=>p.amount), mine=sum(ps,p=>p.myShare), acad=sum(ps,p=>p.academyShare), rent=sum(rs,r=>r.total), exp=sum(es,e=>e.amount);
  return {ps,rs,es,subs,mine,acad,rent,exp,gross:subs+rent,profit:mine+rent-exp,news:ps.filter(p=>p.type==='new').length,renews:ps.filter(p=>p.type==='renew').length,hours:sum(rs,r=>r.hours)};
}
const delta=(c,p)=>{ if(!p) return c?'<span class="dl up">جديد</span>':''; const v=Math.round((c-p)/Math.abs(p)*100); return `<span class="dl ${v>=0?'up':'dn'}">${v>=0?'▲':'▼'} ${Math.abs(v)}%</span>`; };
function trendChart(){
  const data=monthsBack(12).map(m=>{const s=periodStats(d=>d.startsWith(m));return {m,inc:s.mine+s.rent,exp:s.exp};});
  const max=Math.max(1,...data.flatMap(d=>[d.inc,d.exp])), W=760,H=230,top=14,base=H-28,gap=W/12,bw=17;
  let g='';
  [0,.5,1].forEach(f=>{const y=base-(base-top)*f;g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" style="stroke:var(--line)" stroke-dasharray="3 4"/>`+(f?`<text x="${W-2}" y="${y-3}" text-anchor="end" font-size="10" style="fill:var(--muted)">${Math.round(max*f).toLocaleString('ar-EG')}</text>`:'');});
  data.forEach((d,i)=>{const cx=W-gap*i-gap/2,h1=(d.inc/max)*(base-top),h2=(d.exp/max)*(base-top);
    g+=`<rect x="${cx-bw-1}" y="${base-h1}" width="${bw}" height="${h1}" rx="3" style="fill:var(--turf)"><title>${d.m} — دخلي: ${money(d.inc)}</title></rect>
    <rect x="${cx+1}" y="${base-h2}" width="${bw}" height="${h2}" rx="3" style="fill:var(--red);opacity:.8"><title>${d.m} — مصروفات: ${money(d.exp)}</title></rect>
    <text x="${cx}" y="${H-10}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${d.m.slice(5)}/${d.m.slice(2,4)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="الدخل والمصروفات آخر 12 شهر">${g}</svg>
  <div class="legend"><span><i style="background:var(--turf)"></i>دخلي (نصيبي + إيجار)</span><span><i style="background:var(--red)"></i>المصروفات</span></div>`;
}
const stack=parts=>{const t=sum(parts,p=>p.v);if(!t) return '<div class="empty">لا توجد بيانات</div>';
  return `<div class="stack">${parts.map(p=>`<i style="width:${p.v/t*100}%;background:${p.c}" title="${p.l}: ${money(p.v)}"></i>`).join('')}</div>
  <div class="legend">${parts.map(p=>`<span><i style="background:${p.c}"></i>${p.l}: <b>${p.t||money(p.v)}</b> <span class="muted">(${Math.round(p.v/t*100)}%)</span></span>`).join('')}</div>`;};
const hb=(label,sub,v,max,txt,col)=>`<div class="hb"><div>${esc(label)}<small>${sub}</small></div><div class="tr"><div class="fl" style="width:${Math.max(2,v/max*100)}%;${col?'background:'+col:''}"></div></div><b class="num">${txt}</b></div>`;
function viewDashboard(){
  const inR=d=>!dashM||d.startsWith(dashM);
  const S=periodStats(inR), P=dashM?periodStats(d=>d.startsWith(prevMonth(dashM))):null;
  const cmp=(c,p)=>P?delta(c,p)+' <span class="muted" style="font-size:11px">عن الشهر اللي فات</span>':'';
  const mem={ok:0,soon:0,exp:0}; store.members.forEach(m=>mem[statusOf(m.end)[0]]++);
  const missing=allReceipts().filter(r=>r.kind==='in'&&!r.no).length;
  const acs=store.academies.map(a=>{const ps=S.ps.filter(p=>p.academyId===a.id);return {a,n:ps.length,total:sum(ps,p=>p.amount),mine:sum(ps,p=>p.myShare),members:store.members.filter(m=>m.academyId===a.id).length};}).sort((x,y)=>y.total-x.total);
  const flds=store.fields.map(f=>{const sub=sum(S.ps.filter(p=>p.fieldId===f.id),p=>p.myShare),rent=sum(S.rs.filter(r=>r.fieldId===f.id),r=>r.total);return {f,sub,rent,t:sub+rent};}).sort((x,y)=>y.t-x.t);
  const need=store.members.map(m=>({m,d:daysLeft(m.end)})).filter(x=>x.d<=7&&x.d>=-30).sort((a,b)=>a.d-b.d).slice(0,10);
  const last=allReceipts().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
  const maxA=Math.max(1,...acs.map(x=>x.total)), maxF=Math.max(1,...flds.map(x=>x.t));
  return `<div class="hero"><div><h2>لوحة التحكم</h2><p>${new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'})} · الفترة: ${dashM||'كل الفترات'}</p></div>
    <div class="ctl noprint"><input type="month" value="${dashM}" onchange="dashM=this.value;render()"><button class="btn sm ghost" onclick="dashM='';render()">كل الفترات</button><button class="btn sm gold" onclick="window.print()">طباعة</button></div></div>
  ${missing?`<div class="alert noprint">⚠️ <b>${missing}</b> عملية دفع من غير رقم إيصال <button class="btn sm gold" onclick="rcF.missing=true;go('receipts')">اعرضها وكمّلها</button></div>`:''}
  <div class="kpis">
    ${kpi('صافي الربح (بعد المصروفات)',money(S.profit),cmp(S.profit,P?.profit),'gold')}
    ${kpi('إجمالي المقبوض (اشتراكات + إيجار)',money(S.gross),cmp(S.gross,P?.gross))}
    ${kpi('نصيبي من الأكاديميات',money(S.mine),`من ${S.ps.length} عملية`)}
    ${kpi('إيراد إيجار الساعات',money(S.rent),`${S.hours} ساعة · ${S.rs.length} حجز`,'blue')}
    ${kpi('المصروفات',money(S.exp),cmp(S.exp,P?.exp),'red')}
    ${kpi('مستحق للأكاديميات',money(S.acad),'من إجمالي اشتراكات '+money(S.subs),'blue')}
    ${kpi('المشتركين الساريين',mem.ok+mem.soon,`${mem.soon} قرب يخلص · ${mem.exp} منتهي · إجمالي ${store.members.length}`)}
    ${kpi('اشتراكات جديدة / تجديدات',S.news+' / '+S.renews,'في الفترة المختارة')}
  </div>
  <div class="panel"><h3>الدخل والمصروفات — آخر 12 شهر</h3>${trendChart()}</div>
  <div class="grid2">
    <div class="panel"><h3>الأكاديميات (إجمالي المقبوض)</h3>${acs.length?acs.map(x=>hb(x.a.name,`${x.n} عملية · ${x.members} مشترك · نصيبي ${money(x.mine)}`,x.total,maxA,money(x.total))).join(''):'<div class="empty">لا توجد أكاديميات</div>'}</div>
    <div class="panel"><h3>الملاعب (دخلي: نسب + إيجار)</h3>${flds.length?flds.map(x=>hb(x.f.name,`نسب ${money(x.sub)} · إيجار ${money(x.rent)}`,x.t,maxF,money(x.t),'var(--gold)')).join(''):'<div class="empty">لا توجد ملاعب</div>'}</div>
  </div>
  <div class="grid2">
    <div class="panel"><h3>حالة الاشتراكات</h3>${stack([{l:'ساري',v:mem.ok,c:'var(--ok)',t:mem.ok},{l:'قرب يخلص',v:mem.soon,c:'var(--amber)',t:mem.soon},{l:'منتهي',v:mem.exp,c:'var(--red)',t:mem.exp}])}</div>
    <div class="panel"><h3>توزيع إجمالي المقبوض</h3>${stack([{l:'نصيبي',v:S.mine,c:'var(--turf)'},{l:'إيجار',v:S.rent,c:'var(--gold)'},{l:'للأكاديميات',v:S.acad,c:'#2f6f9f'}])}</div>
  </div>
  <div class="grid2">
    <div class="panel tablewrap"><h3>محتاجين متابعة (ينتهي خلال 7 أيام أو انتهى من 30 يوم)</h3>${need.length?`<table><tr><th>المشترك</th><th>الأكاديمية</th><th>الانتهاء</th><th>الحالة</th><th></th></tr>
      ${need.map(({m})=>{const [c,t]=statusOf(m.end);return `<tr><td><b>${esc(m.name)}</b></td><td>${esc(nameOf('academies',m.academyId))}</td><td>${m.end}</td><td><span class="tag ${c}">${t}</span></td>
      <td class="act"><button class="btn sm gold noprint" onclick="renewForm('${m.id}')">تجديد</button><span class="noprint">${waBtn(m)}</span></td></tr>`;}).join('')}</table>`:'<div class="empty">مفيش اشتراكات محتاجة متابعة 👌</div>'}</div>
    <div class="panel tablewrap"><h3>آخر الإيصالات</h3>${last.length?`<table><tr><th>رقم</th><th>التاريخ</th><th>البيان</th><th>المبلغ</th></tr>
      ${last.map(r=>`<tr><td>${r.no?`<b>${esc(r.no)}</b>`:'<span class="tag exp">بدون</span>'}</td><td>${r.date}</td><td style="white-space:normal">${esc(r.who)} <span class="muted">— ${r.type}</span></td><td class="num">${r.kind==='out'?'− ':''}${money(r.amount)}</td></tr>`).join('')}</table>
      <div style="margin-top:8px" class="noprint"><button class="btn sm ghost" onclick="go('receipts')">كل الإيصالات ←</button></div>`:'<div class="empty">لسه مفيش إيصالات</div>'}</div>
  </div>`;
}

/* ============ تقرير الأكاديميات (للأدمن فقط) ============ */
let repFilter={from:todayStr().slice(0,7)+'-01',to:todayStr().slice(0,7)+'-31',academy:'',mode:'academy'};
function repPreset(k){const cur=todayStr().slice(0,7),m=k==='prev'?prevMonth(cur):cur;repFilter.from=k==='all'?'':m+'-01';repFilter.to=k==='all'?'':m+'-31';render();}
const periodLabel=(f,t)=>(!f&&!t)?'كل الفترات':(f&&t&&f.endsWith('-01')&&t.endsWith('-31')&&f.slice(0,7)===t.slice(0,7))?f.slice(0,7):`من ${f||'البداية'} إلى ${t||'اليوم'}`;
function repData(){
  const inR=d=>(!repFilter.from||d>=repFilter.from)&&(!repFilter.to||d<=repFilter.to);
  return store.academies.filter(a=>!repFilter.academy||a.id===repFilter.academy).map(a=>{
    const ps=store.payments.filter(p=>p.academyId===a.id&&inR(p.date)).sort((x,y)=>x.date.localeCompare(y.date)||String(x.receiptNo).localeCompare(String(y.receiptNo),undefined,{numeric:true}));
    return {a,ps,total:sum(ps,p=>p.amount),mine:sum(ps,p=>p.myShare),acad:sum(ps,p=>p.academyShare),nNew:ps.filter(p=>p.type==='new').length};
  });
}
function viewReport(){
  const A=repFilter.mode==='academy', per=periodLabel(repFilter.from,repFilter.to), rows=repData();
  const G={total:sum(rows,r=>r.total),mine:sum(rows,r=>r.mine),acad:sum(rows,r=>r.acad)};
  const issued=new Date().toLocaleDateString('ar-EG');
  const summary=(!A&&rows.length>1)?`<section class="panel acad-block"><div class="st-head"><div><div class="st-org">${esc(ORG_NAME)}</div><h3 style="margin:2px 0 0">ملخص الأكاديميات — تقرير داخلي</h3></div><div class="st-meta">الفترة: <b>${esc(per)}</b><br>تاريخ الإصدار: <b>${issued}</b></div></div>
    <div class="tablewrap"><table><tr><th>الأكاديمية</th><th>الملعب</th><th>العمليات</th><th>إجمالي المقبوض</th><th>مستحق للأكاديمية</th><th>نصيبي</th></tr>
    ${rows.map(r=>`<tr><td><b>${esc(r.a.name)}</b></td><td>${esc(nameOf('fields',r.a.fieldId))}</td><td class="num">${r.ps.length}</td><td class="num">${money(r.total)}</td><td class="num">${money(r.acad)}</td><td class="num">${money(r.mine)}</td></tr>`).join('')}
    <tr class="tot-row"><td colspan="3">الإجمالي</td><td class="num">${money(G.total)}</td><td class="num">${money(G.acad)}</td><td class="num">${money(G.mine)}</td></tr></table></div></section>`:'';
  const blocks=rows.map(r=>{const a=r.a;
    const cols=[['م',(p,i)=>i+1],['رقم الإيصال',p=>p.receiptNo?`<b>${esc(p.receiptNo)}</b>`:'—'],['تاريخ الإيصال',p=>p.receiptDate||p.date],['المشترك',p=>esc(p.memberName||nameOf('members',p.memberId))],
      ['النوع',p=>p.type==='new'?'جديد':'تجديد'],['فترة الاشتراك',p=>p.start+' ← '+p.end],['المبلغ المحصل',p=>money(p.amount),'num'],
      ['نسبة الأكاديمية',p=>(100-(p.pct??a.myPct))+'%','num'],['نصيب الأكاديمية',p=>money(p.academyShare),'num']];
    if(!A) cols.push(['نسبتي',p=>(p.pct??a.myPct)+'%','num'],['نصيبي',p=>money(p.myShare),'num']);
    return `<section class="panel acad-block">
      <div class="st-head"><div><div class="st-org">${esc(ORG_NAME)}</div><h3 style="margin:2px 0 0">${A?'كشف حساب أكاديمية':'تقرير داخلي'}: ${esc(a.name)}</h3></div>
        <div class="st-meta">الملعب: <b>${esc(nameOf('fields',a.fieldId))}</b><br>الفترة: <b>${esc(per)}</b><br>تاريخ الإصدار: <b>${issued}</b></div></div>
      <div class="st-sum"><div><small class="muted">عدد العمليات</small><b>${r.ps.length}</b><small class="muted">${r.nNew} جديد + ${r.ps.length-r.nNew} تجديد</small></div>
        <div><small class="muted">إجمالي المقبوض</small><b>${money(r.total)}</b></div>
        <div><small class="muted">المستحق للأكاديمية (${100-a.myPct}%)</small><b>${money(r.acad)}</b></div>${A?'':`<div><small class="muted">نصيبي (${a.myPct}%)</small><b>${money(r.mine)}</b></div>`}</div>
      ${r.ps.length?`<div class="tablewrap"><table><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr>
      ${r.ps.map((p,i)=>`<tr>${cols.map(c=>`<td class="${c[2]||''}">${c[1](p,i)}</td>`).join('')}</tr>`).join('')}
      <tr class="tot-row"><td colspan="6">الإجمالي</td><td class="num">${money(r.total)}</td><td></td><td class="num">${money(r.acad)}</td>${A?'':`<td></td><td class="num">${money(r.mine)}</td>`}</tr></table></div>`
      :'<div class="empty">مفيش عمليات في الفترة دي</div>'}
      ${A?`<div class="sign"><span>توقيع الأكاديمية</span><span>توقيع الإدارة</span></div>`:''}
    </section>`;}).join('');
  return `<div class="toolbar noprint"><h2 class="grow" style="margin:0">تقرير الأكاديميات</h2>
    <button class="btn gold" onclick="exportReport()">طباعة / PDF</button><button class="btn ghost" onclick="exportReportCSV()">تصدير Excel</button></div>
  <div class="toolbar noprint">
    <select style="max-width:270px" onchange="repFilter.mode=this.value;render()"><option value="academy" ${A?'selected':''}>كشف للأكاديمية (بدون نصيبي)</option><option value="internal" ${A?'':'selected'}>تقرير داخلي (بنصيبي)</option></select>
    <select style="max-width:210px" onchange="repFilter.academy=this.value;render()"><option value="">كل الأكاديميات</option>${options('academies',repFilter.academy)}</select>
    <label style="margin:0">من</label><input type="date" style="width:auto" value="${repFilter.from}" onchange="repFilter.from=this.value;render()">
    <label style="margin:0">إلى</label><input type="date" style="width:auto" value="${repFilter.to}" onchange="repFilter.to=this.value;render()">
    <button class="btn sm ghost" onclick="repPreset('cur')">الشهر الحالي</button><button class="btn sm ghost" onclick="repPreset('prev')">الشهر اللي فات</button><button class="btn sm ghost" onclick="repPreset('all')">كل الفترات</button>
  </div>
  <div class="kpis noprint">${kpi('إجمالي المقبوض',money(G.total))}${kpi('مستحق للأكاديميات',money(G.acad),'','blue')}${A?'':kpi('نصيبي',money(G.mine),'','gold')}</div>
  ${A?'<div class="hint noprint" style="margin-bottom:10px">وضع الكشف: نصيبك مخفي بالكامل من الشاشة والطباعة والـ PDF والـ Excel. اطبع كل أكاديمية على صفحة لوحدها.</div>':''}
  ${summary}${blocks||'<div class="panel empty">لسه مفيش أكاديميات</div>'}`;
}
function exportReport(){
  const t=document.title, one=repFilter.academy?nameOf('academies',repFilter.academy)+' ':'';
  document.title=(repFilter.mode==='academy'?'كشف حساب ':'تقرير داخلي ')+one+periodLabel(repFilter.from,repFilter.to);
  window.print(); document.title=t;
}
function exportReportCSV(){
  const A=repFilter.mode==='academy';
  const head=['الأكاديمية','رقم الإيصال','تاريخ الإيصال','المشترك','النوع','بداية الاشتراك','نهاية الاشتراك','المبلغ المحصل','نسبة الأكاديمية %','نصيب الأكاديمية',...(A?[]:['نسبتي %','نصيبي'])];
  const out=[head];
  repData().forEach(r=>r.ps.forEach(p=>out.push([r.a.name,p.receiptNo||'',p.receiptDate||p.date,p.memberName||nameOf('members',p.memberId),p.type==='new'?'جديد':'تجديد',p.start,p.end,p.amount,100-(p.pct??r.a.myPct),p.academyShare,...(A?[]:[p.pct??r.a.myPct,p.myShare])])));
  downloadCSV((A?'academy_statement_':'internal_report_')+todayStr(),out);
}

/* ============ سجل التحديثات (للأدمن فقط) ============ */
let logFilter={user:'',action:''};
const ACT={add:['ok','إضافة'],edit:['soon','تعديل'],delete:['exp','حذف']};
function filteredLogs(){
  return store.logs.filter(l=>(!logFilter.user||l.user===logFilter.user)&&(!logFilter.action||l.action===logFilter.action));
}
function viewLogs(){
  const users=[...new Set(store.logs.map(l=>l.user))];
  const list=filteredLogs();
  return `<div class="toolbar"><h2 class="grow" style="margin:0">سجل التحديثات</h2>
    <button class="btn sm danger" onclick="clearLogs()" ${list.length?'':'disabled'}>مسح المعروض (${list.length})</button></div>
  <div class="toolbar">
    <select style="max-width:240px" onchange="logFilter.user=this.value;render()"><option value="">كل المستخدمين</option>
      ${users.map(u=>`<option value="${esc(u)}" ${u===logFilter.user?'selected':''}>${esc(u)}</option>`).join('')}</select>
    <select style="max-width:160px" onchange="logFilter.action=this.value;render()"><option value="">كل العمليات</option>
      ${Object.entries(ACT).map(([k,v])=>`<option value="${k}" ${k===logFilter.action?'selected':''}>${v[1]}</option>`).join('')}</select>
  </div>
  <div class="panel tablewrap">${list.length?`<table><tr><th>الوقت</th><th>المستخدم</th><th>العملية</th><th>القسم</th><th>التفاصيل</th><th></th></tr>
  ${list.map(l=>`<tr><td>${new Date(l.time).toLocaleString('ar-EG')}</td><td>${esc(l.user)}</td>
    <td><span class="tag ${ACT[l.action]?.[0]||''}">${ACT[l.action]?.[1]||l.action}</span></td>
    <td>${SEC[l.section]||''}</td><td style="white-space:normal">${esc(l.label)}</td>
    <td class="act"><button class="btn sm danger" onclick="delLog('${l.id}')">حذف</button></td></tr>`).join('')}</table>`
   :'<div class="empty">مفيش عمليات مسجلة</div>'}</div>`;
}
async function delLog(id){
  if(useFirebase) await fdb.collection('logs').doc(id).delete();
  else{ store.logs=store.logs.filter(l=>l.id!==id); localStorage.setItem('sm_logs',JSON.stringify(store.logs)); render(); }
}
async function clearLogs(){
  const list=filteredLogs();
  if(!list.length||!confirm(`هتمسح ${list.length} سجل. متأكد؟`)) return;
  if(useFirebase){
    for(let i=0;i<list.length;i+=400){
      const b=fdb.batch(); list.slice(i,i+400).forEach(l=>b.delete(fdb.collection('logs').doc(l.id))); await b.commit();
    }
  }else{
    const ids=new Set(list.map(l=>l.id)); store.logs=store.logs.filter(l=>!ids.has(l.id));
    localStorage.setItem('sm_logs',JSON.stringify(store.logs)); render();
  }
}

/* ============ حذف عام + التنقل ============ */
async function delItem(col,id){
  if(col==='fields' && (store.academies.some(a=>a.fieldId===id)||store.rentals.some(r=>r.fieldId===id)))
    return alert('الملعب عليه أكاديميات أو حجوزات، امسحها الأول');
  if(col==='academies' && store.members.some(m=>m.academyId===id))
    return alert('الأكاديمية عليها مشتركين، امسحهم الأول');
  if(!confirm('متأكد من الحذف؟')) return;
  await Data.del(col,id);
}
const ADMIN_TABS=['dashboard','report','logs'];
let tab='dashboard';
const views={dashboard:viewDashboard,receipts:viewReceipts,accounts:viewAccounts,members:viewMembers,rentals:viewRentals,expenses:viewExpenses,academies:viewAcademies,fields:viewFields,logs:viewLogs,report:viewReport};
function render(){
  if(ADMIN_TABS.includes(tab)&&!isAdmin) tab='accounts';
  $('#view').innerHTML=views[tab]();
}
function go(t){
  tab=t; document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===t)); render(); window.scrollTo(0,0);
}
$('#nav').onclick=e=>{ const b=e.target.closest('button'); if(b) go(b.dataset.t); };

/* ============ الوضع الداكن ============ */
function applyTheme(t){ document.documentElement.dataset.theme=t; $('#themeBtn').textContent=t==='dark'?'☀️ الوضع الفاتح':'🌙 الوضع الداكن'; }
function toggleTheme(){ const t=document.documentElement.dataset.theme==='dark'?'light':'dark'; try{localStorage.setItem('theme',t)}catch(e){} applyTheme(t); }
applyTheme((()=>{try{return localStorage.getItem('theme')}catch(e){return null}})()||'light');

/* ============ تسجيل الدخول والتشغيل ============ */
async function doLogin(){
  try{ await firebase.auth().signInWithEmailAndPassword(val('lEmail'),$('#lPass').value); $('#lErr').textContent=''; }
  catch(e){ $('#lErr').textContent='الإيميل أو الباسورد غلط'; }
}
const mt=$('#modeTag');
if(!useFirebase){
  mt.textContent='وضع تجريبي (تخزين محلي)'; mt.classList.add('warn');
  $('#logsTab').hidden=false; $('#reportTab').hidden=false; $('#dashTab').hidden=false; Data.start();
}else{
  let started=false;
  firebase.auth().onAuthStateChanged(u=>{
    $('#login').hidden=!!u; $('#logoutBtn').hidden=!u;
    if(!u) return;
    USER={email:u.email,uid:u.uid};
    isAdmin=u.email.toLowerCase()===ADMIN_EMAIL.toLowerCase();
    $('#logsTab').hidden=!isAdmin; $('#reportTab').hidden=!isAdmin; $('#dashTab').hidden=!isAdmin;
    mt.textContent=(isAdmin?'أدمن: ':'مستخدم: ')+u.email;
    if(!started){ started=true; go(isAdmin?'dashboard':'accounts'); Data.start(); }
  });
}
</script>
